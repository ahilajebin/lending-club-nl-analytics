<!DOCTYPE html>
<html>
<head>
    <title>Lending Club Analytics</title>
</head>
<body>
    <h2>Ask a question about loan defaults</h2>

    <form method="post">
        <input type="text" name="question" size="80" required>
        <button type="submit">Ask</button>
    </form>

    {% if answer %}
        <h3>Answer</h3>
        <p>{{ answer }}</p>
    {% endif %}
</body>
</html>
